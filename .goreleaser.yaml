version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: s3reg
    main: ./cmd/s3reg
    binary: s3reg
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/stephenwilliams/s3-registry/internal/buildinfo.Version={{ .Version }}
      - -X github.com/stephenwilliams/s3-registry/internal/buildinfo.Commit={{ .Commit }}
      - -X github.com/stephenwilliams/s3-registry/internal/buildinfo.BuiltAt={{ .Date }}
      - -X github.com/stephenwilliams/s3-registry/internal/buildinfo.GitTag={{ .Tag }}

archives:
  - id: s3reg
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

dockers_v2:
  - id: s3reg
    ids:
      - s3reg
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/stephenwilliams/s3-registry
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    annotations:
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
